<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ink 交通天氣資訊屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --eink-black: #000000;
            --eink-white: #ffffff;
        }
        body {
            background-color: var(--eink-white);
            color: var(--eink-black);
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            /* 開啟抗鋸齒，讓墨水屏上的字體邊緣更平滑清晰 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* 淺灰色的極簡邊框設定 */
        .eink-border-r {
            border-right: 2px solid #ccc;
        }
        .eink-divider {
            border-bottom: 2px solid #ccc;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-screen p-2 box-border flex gap-3">

    <!-- 左側：時間與月曆 (佔比 55%) -->
    <aside class="w-[55%] flex flex-col eink-border-r pr-3 h-full min-h-0">
        <!-- 時間區塊 -->
        <div class="flex-none flex flex-col items-center justify-center eink-divider pb-2 pt-2">
            <!-- 加上 pt-2 讓它與右側頂部稍微對齊 -->
            <div id="date-display" class="text-3xl font-bold mb-2 text-gray-600">載入中...</div>
            <div id="time-display" class="text-[10rem] leading-none font-black tracking-tighter text-gray-800">--:--</div>
        </div>
        
        <!-- 月曆區塊 -->
        <div class="flex-1 flex flex-col pt-2 pb-1 justify-center min-h-0">
            <div class="flex items-center gap-2 mb-2 px-2 text-xl font-bold text-gray-800 flex-none">
                <i class="ph-bold ph-calendar-blank text-2xl"></i>
                <span id="calendar-month-title">--</span>
            </div>
            <div id="calendar-container" class="flex-1 min-h-0 w-full flex flex-col justify-center"></div>
        </div>
    </aside>

    <!-- 右側：天氣與交通 (佔比 45%) -->
    <main class="w-[45%] flex flex-col h-full min-h-0 pb-1">
        
        <!-- 天氣區塊 -->
        <section class="flex-[0.35] flex flex-col justify-between pt-2 pb-3 eink-divider min-h-0">
            <div class="flex items-center justify-between text-base font-bold text-gray-500 mb-1 flex-none">
                <div class="flex items-center gap-1"><i class="ph-fill ph-map-pin"></i> <span id="weather-location">香港天文台</span></div>
                <div class="flex items-center gap-1"><i class="ph-bold ph-clock-clockwise"></i> <span id="last-update">--:--</span></div>
            </div>
            
            <div class="flex items-center justify-center gap-2 flex-1 min-h-0">
                <i class="ph-fill ph-thermometer text-[5rem] text-gray-800"></i>
                <!-- 溫度稍微調淺為 gray-800 -->
                <div id="temp-display" class="text-[6.5rem] leading-none font-black tracking-tighter text-gray-800">--°</div>
            </div>
            
            <!-- 放大的濕度與降雨機率 (text-3xl) -->
            <div class="flex items-center justify-center gap-10 text-3xl font-bold w-full mt-1 flex-none">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-drop text-gray-600"></i>
                    <span id="humidity-display">--%</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-umbrella text-gray-600"></i>
                    <span id="pop-display">--</span>
                </div>
            </div>
        </section>

        <!-- 交通區塊 -->
        <section class="flex-[0.65] flex flex-col min-h-0">
            <!-- 港鐵 -->
            <div class="flex-1 flex flex-col justify-center py-2 eink-divider min-h-0">
                <div class="flex items-center gap-2 text-xl font-bold mb-2 flex-none">
                    <i class="ph-fill ph-train text-2xl text-gray-800"></i> 
                    <span>柯士甸站 (屯馬線)</span>
                </div>
                <div class="flex flex-col gap-2 flex-1 justify-center px-2">
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold text-gray-600">往烏溪沙</span>
                        <div class="flex items-baseline gap-2 flex-1 justify-end">
                            <span id="mtr-up-1" class="text-5xl font-black">--</span>
                            <span class="text-xl text-gray-500 font-bold w-6" id="mtr-up-1-unit"></span>
                            <span id="mtr-up-2" class="text-3xl font-bold text-gray-400 w-16 text-right">--</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold text-gray-600">往屯門</span>
                        <div class="flex items-baseline gap-2 flex-1 justify-end">
                            <span id="mtr-down-1" class="text-5xl font-black">--</span>
                            <span class="text-xl text-gray-500 font-bold w-6" id="mtr-down-1-unit"></span>
                            <span id="mtr-down-2" class="text-3xl font-bold text-gray-400 w-16 text-right">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 巴士 -->
            <div class="flex-[0.8] flex flex-col justify-center py-2 min-h-0">
                <div class="flex items-center gap-2 text-xl font-bold mb-2 flex-none">
                    <i class="ph-fill ph-bus text-2xl text-gray-800"></i> 
                    <span>A22 (往藍田)</span>
                    <span id="bus-stop-name" class="text-sm text-gray-400 ml-auto font-normal truncate max-w-[100px]">載入中</span>
                </div>
                <div class="flex items-center justify-between flex-1 px-4">
                    <div class="flex items-baseline gap-1">
                        <span id="bus-eta-1" class="text-5xl font-black">--</span>
                        <span class="text-xl text-gray-500 font-bold" id="bus-eta-1-unit"></span>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span id="bus-eta-2" class="text-4xl font-bold text-gray-400">--</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let a22StopId = null;
        let hkHolidays = [];

        // 1. 獲取公眾假期 (使用 Nager.Date)
        async function fetchHolidays() {
            try {
                const year = new Date().getFullYear();
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`);
                const data = await res.json();
                hkHolidays = data.map(ev => ev.date.replace(/-/g, ''));
            } catch (error) {
                console.error("假期讀取失敗:", error);
            }
        }

        // 2. 渲染月曆
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const todayStr = `${year}${String(month + 1).padStart(2, '0')}${String(today).padStart(2, '0')}`;

            // 月曆標題改為 MM-YYYY
            document.getElementById('calendar-month-title').innerText = `${String(month + 1).padStart(2, '0')}-${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 調整 grid 設定，縮減行距
            let html = `<div class="grid grid-cols-7 gap-y-1 text-center w-full px-1">`;
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            days.forEach(d => {
                const isWeekend = d === '日' || d === '六';
                html += `<div class="font-bold text-lg mb-1 ${isWeekend ? 'text-gray-400' : 'text-gray-600'}">${d}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month + 1).padStart(2, '0')}${String(i).padStart(2, '0')}`;
                const currentDayOfWeek = new Date(year, month, i).getDay();
                const isWeekend = currentDayOfWeek === 0 || currentDayOfWeek === 6;
                const isHoliday = hkHolidays.includes(dateStr);
                const isToday = i === today;

                // 強制套用 border 保持排版高度一致，非今日則透明
                let textClass = "text-2xl font-bold leading-none "; // 縮小字體至 2xl 確保能塞滿 6 週
                let circleClass = "flex items-center justify-center h-10 w-10 mx-auto rounded-full border-[3px] box-border ";

                if (isToday) {
                    circleClass += "border-black text-black ";
                } else {
                    circleClass += "border-transparent ";
                    // 週末及假日的灰色加深至 gray-400
                    if (isWeekend || isHoliday) {
                        textClass += "text-gray-400 ";
                    } else {
                        textClass += "text-black ";
                    }
                }

                const marker = isHoliday && !isToday ? `<div class="w-1 h-1 bg-gray-400 rounded-full mt-0.5"></div>` : `<div class="w-1 h-1 mt-0.5 opacity-0"></div>`;

                html += `<div class="flex flex-col items-center justify-start"><div class="${circleClass}"><span class="${textClass}">${i}</span></div>${marker}</div>`;
            }
            html += `</div>`;
            document.getElementById('calendar-container').innerHTML = html;
        }

        // 3. 格式化時間與日期
        function formatTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + 
                   date.getMinutes().toString().padStart(2, '0');
        }

        function updateTime() {
            const now = new Date();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            // 換成 DD-MM-YYYY (短星期)
            const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()} (${days[now.getDay()]})`;
            
            document.getElementById('date-display').innerText = dateStr;
            document.getElementById('time-display').innerText = formatTime(now);
            renderCalendar();
        }

        // 4. 獲取天氣數據 (鎖定香港天文台)
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();

                // 優先尋找香港天文台
                let targetTemp = data.temperature.data.find(d => d.place === "香港天文台");

                if (targetTemp) {
                    // 保留小數點後一位
                    document.getElementById('temp-display').innerText = `${parseFloat(targetTemp.value).toFixed(1)}°`;
                    document.getElementById('weather-location').innerText = targetTemp.place;
                }

                if (data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('humidity-display').innerText = `${data.humidity.data[0].value}%`;
                }

                // 獲取降雨機率 (PSR)
                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                
                if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const todayForecast = fndData.weatherForecast[0];
                    if (todayForecast.PSR) {
                        document.getElementById('pop-display').innerText = todayForecast.PSR;
                    }
                }
            } catch (error) {
                console.error("天氣讀取失敗:", error);
            }
        }

        // 5. 獲取港鐵資訊
        async function fetchMTR() {
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=AUS');
                const result = await res.json();

                if (result.status === 1 && result.data && result.data['TML-AUS']) {
                    const upTrains = result.data['TML-AUS'].UP; 
                    const downTrains = result.data['TML-AUS'].DOWN; 

                    function formatMtrUI(train, idPrefix) {
                        if (!train || train.ttnt === undefined) {
                            document.getElementById(`${idPrefix}-1`).innerText = "--";
                            document.getElementById(`${idPrefix}-1-unit`).innerText = "";
                            return;
                        }
                        
                        const el1 = document.getElementById(`${idPrefix}-1`);
                        const el1Unit = document.getElementById(`${idPrefix}-1-unit`);
                        
                        // 動態樣式切換：為 0 時顯示 Now
                        if (train.ttnt === "0" || train.ttnt === "") {
                            el1.innerText = "Now";
                            el1.className = "text-3xl font-bold text-gray-500";
                            el1Unit.innerText = "";
                        } else {
                            el1.innerText = train.ttnt;
                            el1.className = "text-5xl font-black text-black";
                            el1Unit.innerText = "m"; // 改為 m
                        }
                    }

                    if (upTrains && upTrains.length > 0) {
                        formatMtrUI(upTrains[0], 'mtr-up');
                        const up2 = upTrains.length > 1 ? upTrains[1].ttnt : "--";
                        document.getElementById('mtr-up-2').innerText = up2 !== "--" ? `${up2}m` : "--";
                    }

                    if (downTrains && downTrains.length > 0) {
                        formatMtrUI(downTrains[0], 'mtr-down');
                        const down2 = downTrains.length > 1 ? downTrains[1].ttnt : "--";
                        document.getElementById('mtr-down-2').innerText = down2 !== "--" ? `${down2}m` : "--";
                    }
                }
            } catch (error) {
                console.error("港鐵讀取失敗:", error);
            }
        }

        // 6. 獲取城巴資訊
        async function fetchBus() {
            try {
                if (!a22StopId) {
                    const routeRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/A22/inbound');
                    const routeData = await routeRes.json();
                    
                    if (routeData.data && routeData.data.length > 0) {
                        for (let i = 0; i < Math.min(20, routeData.data.length); i++) {
                            const stopId = routeData.data[i].stop;
                            const stopRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`);
                            const stopInfo = await stopRes.json();
                            
                            if (stopInfo.data.name_tc.includes("柯士甸") || stopInfo.data.name_tc.includes("佐敦")) {
                                a22StopId = stopId;
                                // 簡化站名
                                document.getElementById('bus-stop-name').innerText = "柯士甸站";
                                break;
                            }
                        }
                    }
                }

                if (a22StopId) {
                    const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${a22StopId}/A22`);
                    const etaData = await etaRes.json();
                    
                    if (etaData.data && etaData.data.length > 0) {
                        const validEtas = etaData.data.filter(e => e.dir === 'I' && !!e.eta).sort((a, b) => new Date(a.eta) - new Date(b.eta));
                        
                        if (validEtas.length > 0) {
                            const targetTime = new Date(validEtas[0].eta.replace(' ', 'T'));
                            const diffMins = Math.floor((targetTime - new Date()) / 60000);
                            
                            const elEta1 = document.getElementById('bus-eta-1');
                            const elEta1Unit = document.getElementById('bus-eta-1-unit');
                            
                            // 動態樣式切換
                            if (diffMins <= 0) {
                                elEta1.innerText = "Now";
                                elEta1.className = "text-3xl font-bold text-gray-500";
                                elEta1Unit.innerText = "";
                            } else {
                                elEta1.innerText = diffMins;
                                elEta1.className = "text-5xl font-black text-black";
                                elEta1Unit.innerText = "m"; // 改為 m
                            }
                            
                            if (validEtas.length > 1) {
                                const targetTime2 = new Date(validEtas[1].eta.replace(' ', 'T'));
                                const diffMins2 = Math.floor((targetTime2 - new Date()) / 60000);
                                document.getElementById('bus-eta-2').innerText = diffMins2 <= 0 ? "Now" : `${diffMins2}m`;
                            } else {
                                document.getElementById('bus-eta-2').innerText = "--";
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("城巴讀取失敗:", error);
            }
        }

        // 7. 更新流程管理
        async function fetchETAs() {
            await Promise.all([fetchMTR(), fetchBus()]);
            // 每次更新完交通數據，順便更新右上角的「最後更新時間」標籤
            document.getElementById('last-update').innerText = formatTime(new Date());
        }

        async function init() {
            await fetchHolidays();
            updateTime();
            
            // 每秒鐘校準本地時間（確保跨過一分鐘時能零延遲跳字）
            setInterval(updateTime, 1000);

            await fetchWeather();
            await fetchETAs();

            // 定時獲取數據（交通 25 秒，天氣 60 秒）
            setInterval(fetchETAs, 25000);
            setInterval(fetchWeather, 60000);
        }

        window.onload = init;
    </script>
</body>
</html>
