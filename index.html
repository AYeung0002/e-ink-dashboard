<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ink 交通天氣資訊屏-0</title>
    <!-- 引入 Tailwind CSS 用於快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons 用於簡潔圖標 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* 針對墨水屏的專屬樣式：強制黑白、高對比、移除抗鋸齒帶來的灰色邊緣 */
        :root {
            --eink-black: #000000;
            --eink-white: #ffffff;
        }
        body {
            background-color: var(--eink-white);
            color: var(--eink-black);
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            -webkit-font-smoothing: none; /* 減少字體邊緣的灰階，適合黑白墨水屏 */
            margin: 0;
            padding: 0;
        }
        /* 粗實線邊框，避免使用陰影和漸層 */
        .eink-border {
            border: 4px solid var(--eink-black);
        }
        .eink-border-b {
            border-bottom: 4px solid var(--eink-black);
        }
        .eink-border-r {
            border-right: 4px solid var(--eink-black);
        }
        .eink-bg-black {
            background-color: var(--eink-black);
            color: var(--eink-white);
        }
        /* 隱藏滾動條 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-screen p-2 box-border flex gap-2">

    <!-- 左側：時間與月曆 (佔比 55%) -->
    <aside class="w-[55%] flex flex-col eink-border h-full">
        <!-- 時間區塊 -->
        <div class="h-[40%] flex flex-col justify-center items-center eink-border-b p-4">
            <div id="date-display" class="text-3xl font-bold mb-2 text-gray-600">載入中...</div>
            <div id="time-display" class="text-[10rem] leading-none font-black tracking-tighter">--:--</div>
        </div>
        <!-- 月曆區塊 -->
        <div class="h-[60%] flex flex-col pt-6 pb-2 justify-center">
            <div class="flex items-center gap-2 mb-4 px-8 text-2xl font-bold text-gray-800">
                <i class="ph-bold ph-calendar-blank text-3xl"></i>
                <span id="calendar-month-title">--月</span>
            </div>
            <div id="calendar-container" class="flex-1"></div>
        </div>
    </aside>

    <!-- 右側：天氣與交通 (佔比 45%) -->
    <main class="w-[45%] flex flex-col gap-2 h-full">
        <!-- 天氣區塊 -->
        <section class="h-[40%] eink-border flex flex-col justify-center items-center p-4 relative">
            <div class="absolute top-4 left-4 flex items-center gap-1 text-xl font-bold text-gray-500">
                <i class="ph-fill ph-map-pin"></i> <span>京士柏</span>
            </div>
            <div class="absolute top-4 right-4 flex items-center gap-1 text-lg font-bold text-gray-400">
                <i class="ph-bold ph-clock-clockwise"></i> <span id="last-update">--:--</span>
            </div>
            
            <div class="flex items-center justify-center gap-4 mt-8 w-full">
                <i class="ph-fill ph-thermometer text-[6rem] text-black"></i>
                <div id="temp-display" class="text-[7rem] leading-none font-black tracking-tighter">--°</div>
            </div>
            
            <div class="flex items-center justify-center gap-10 mt-6 text-4xl font-bold w-full">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-drop text-gray-600"></i>
                    <span id="humidity-display">--%</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-umbrella text-gray-600"></i>
                    <span id="pop-display">--</span>
                </div>
            </div>
            <div id="weather-warning" class="text-2xl font-bold mt-4 h-6 tracking-wide text-gray-800"></div>
        </section>

        <!-- 交通區塊 -->
        <section class="h-[60%] flex flex-col gap-2">
            <!-- 港鐵 -->
            <div class="flex-1 eink-border flex flex-col p-5 justify-center">
                <div class="flex items-center gap-2 text-2xl font-bold mb-5 border-b-2 border-gray-200 pb-2">
                    <i class="ph-fill ph-train text-3xl text-gray-800"></i> 
                    <span>柯士甸站 (屯馬線)</span>
                </div>
                <div class="flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold text-gray-600 w-28">往烏溪沙</span>
                        <div class="flex items-baseline gap-3 flex-1 justify-end">
                            <span id="mtr-up-1" class="text-5xl font-black">--</span>
                            <span class="text-xl text-gray-500 font-bold w-10" id="mtr-up-1-unit"></span>
                            <span id="mtr-up-2" class="text-3xl font-bold text-gray-400 w-20 text-right">--</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold text-gray-600 w-28">往屯門</span>
                        <div class="flex items-baseline gap-3 flex-1 justify-end">
                            <span id="mtr-down-1" class="text-5xl font-black">--</span>
                            <span class="text-xl text-gray-500 font-bold w-10" id="mtr-down-1-unit"></span>
                            <span id="mtr-down-2" class="text-3xl font-bold text-gray-400 w-20 text-right">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 巴士 -->
            <div class="flex-1 eink-border flex flex-col p-5 justify-center">
                <div class="flex items-center gap-2 text-2xl font-bold mb-5 border-b-2 border-gray-200 pb-2">
                    <i class="ph-fill ph-bus text-3xl text-gray-800"></i> 
                    <span>A22 (往藍田)</span>
                    <span id="bus-stop-name" class="text-base text-gray-400 ml-auto font-normal">尋找中...</span>
                </div>
                <div class="flex items-center justify-between mt-2">
                    <span class="text-2xl font-bold text-gray-600 w-28">抵站時間</span>
                    <div class="flex items-baseline gap-3 flex-1 justify-end">
                        <span id="bus-eta-1" class="text-6xl font-black">--</span>
                        <span class="text-xl text-gray-500 font-bold w-10" id="bus-eta-1-unit"></span>
                        <span id="bus-eta-2" class="text-4xl font-bold text-gray-400 w-20 text-right">--</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 核心邏輯與狀態 ---
        let a22StopId = null;
        let hkHolidays = [];

        // 1. 獲取公眾假期 (改用 Nager.Date API 避免 CORS 限制)
        async function fetchHolidays() {
            try {
                const year = new Date().getFullYear();
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`);
                const data = await res.json();
                // Nager.Date 回傳日期格式為 YYYY-MM-DD，需移除橫線轉換為 YYYYMMDD 以符合後續比對邏輯
                hkHolidays = data.map(ev => ev.date.replace(/-/g, ''));
            } catch (error) {
                console.error("假期讀取失敗:", error);
            }
        }

        // 2. 渲染月曆
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const todayStr = `${year}${String(month + 1).padStart(2, '0')}${String(today).padStart(2, '0')}`;

            document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 調整為極小間距，適配小螢幕
            let html = `<div class="grid grid-cols-7 gap-y-0.5 gap-x-0.5 text-center w-full px-2">`;
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            days.forEach(d => {
                const isWeekend = d === '日' || d === '六';
                html += `<div class="font-bold text-sm mb-1 ${isWeekend ? 'text-gray-300' : 'text-gray-600'}">${d}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month + 1).padStart(2, '0')}${String(i).padStart(2, '0')}`;
                const currentDayOfWeek = new Date(year, month, i).getDay();
                const isWeekend = currentDayOfWeek === 0 || currentDayOfWeek === 6;
                const isHoliday = hkHolidays.includes(dateStr);
                const isToday = i === today;

                // 縮小字體與圓圈尺寸
                let textClass = "text-xl font-bold leading-none ";
                let circleClass = "flex items-center justify-center h-9 w-9 mx-auto rounded-full border-[3px] ";

                if (isToday) {
                    circleClass += "border-black text-black ";
                } else {
                    circleClass += "border-transparent ";
                    if (isWeekend || isHoliday) {
                        textClass += "text-gray-300 ";
                    } else {
                        textClass += "text-black ";
                    }
                }

                // 縮小標記點
                const marker = isHoliday && !isToday ? `<div class="w-1.5 h-1.5 bg-gray-300 rounded-full mt-0.5"></div>` : `<div class="w-1.5 h-1.5 mt-0.5 opacity-0"></div>`;

                html += `<div class="flex flex-col items-center justify-start"><div class="${circleClass} ${textClass}">${i}</div>${marker}</div>`;
            }
            html += `</div>`;
            document.getElementById('calendar-container').innerHTML = html;
        }

        // 3. 格式化時間與日期
    // 3. 格式化時間與日期
        function formatTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + 
                   date.getMinutes().toString().padStart(2, '0');
        }

        function updateTime() {
            const now = new Date();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 (星期${days[now.getDay()]})`;
            
            document.getElementById('date-display').innerText = dateStr;
            document.getElementById('time-display').innerText = formatTime(now);
            
            // 每次校時重新渲染月曆，確保跨夜時自動跳轉「今天」
            renderCalendar();
        }

        // 4. 獲取天氣數據
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();

                let targetTemp = data.temperature.data.find(d => d.place === "京士柏");
                if (!targetTemp) targetTemp = data.temperature.data.find(d => d.place === "香港天文台");

                if (targetTemp) {
                    document.getElementById('temp-display').innerText = `${targetTemp.value}°`;
                }

                if (data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('humidity-display').innerText = `${data.humidity.data[0].value}%`;
                }

                if (data.warningMessage && data.warningMessage.length > 0) {
                    document.getElementById('weather-warning').innerText = `⚠️ ${data.warningMessage[0]}`;
                } else {
                    document.getElementById('weather-warning').innerText = "";
                }

                const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fndData = await fndRes.json();
                
                if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const todayForecast = fndData.weatherForecast[0];
                    if (todayForecast.PSR) {
                        document.getElementById('pop-display').innerText = todayForecast.PSR;
                    }
                }
            } catch (error) {
                console.error("天氣讀取失敗:", error);
            }
        }

        // 5. 獲取港鐵資訊
        async function fetchMTR() {
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=AUS');
                const result = await res.json();

                if (result.status === 1 && result.data && result.data['TML-AUS']) {
                    const upTrains = result.data['TML-AUS'].UP; 
                    const downTrains = result.data['TML-AUS'].DOWN; 

                    function formatMtrTime(train) {
                        if (!train || !train.ttnt) return { value: "--", unit: "" };
                        if (train.ttnt === "0" || train.ttnt === "") return { value: "即將", unit: "抵達" };
                        return { value: train.ttnt, unit: "分" };
                    }

                    if (upTrains && upTrains.length > 0) {
                        const up1 = formatMtrTime(upTrains[0]);
                        document.getElementById('mtr-up-1').innerText = up1.value;
                        document.getElementById('mtr-up-1-unit').innerText = up1.unit;
                        
                        const up2 = upTrains.length > 1 ? formatMtrTime(upTrains[1]) : { value: "--", unit: "" };
                        document.getElementById('mtr-up-2').innerText = up2.value !== "--" ? `${up2.value} ${up2.unit}` : "--";
                    }

                    if (downTrains && downTrains.length > 0) {
                        const down1 = formatMtrTime(downTrains[0]);
                        document.getElementById('mtr-down-1').innerText = down1.value;
                        document.getElementById('mtr-down-1-unit').innerText = down1.unit;
                        
                        const down2 = downTrains.length > 1 ? formatMtrTime(downTrains[1]) : { value: "--", unit: "" };
                        document.getElementById('mtr-down-2').innerText = down2.value !== "--" ? `${down2.value} ${down2.unit}` : "--";
                    }
                }
            } catch (error) {
                console.error("港鐵讀取失敗:", error);
            }
        }

        // 6. 獲取城巴資訊
        async function fetchBus() {
            try {
                if (!a22StopId) {
                    const routeRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/A22/inbound');
                    const routeData = await routeRes.json();
                    
                    if (routeData.data && routeData.data.length > 0) {
                        for (let i = 0; i < Math.min(20, routeData.data.length); i++) {
                            const stopId = routeData.data[i].stop;
                            const stopRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`);
                            const stopInfo = await stopRes.json();
                            
                            if (stopInfo.data.name_tc.includes("柯士甸") || stopInfo.data.name_tc.includes("佐敦")) {
                                a22StopId = stopId;
                                document.getElementById('bus-stop-name').innerText = stopInfo.data.name_tc;
                                break;
                            }
                        }
                    }
                }

                function getEtaData(timeString) {
                    if (!timeString) return { value: "--", unit: "" };
                    const targetTime = new Date(timeString.replace(' ', 'T'));
                    const now = new Date();
                    const diffMins = Math.floor((targetTime - now) / 60000);
                    return diffMins <= 0 ? { value: "即將", unit: "抵達" } : { value: diffMins.toString(), unit: "分" };
                }

                if (a22StopId) {
                    const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${a22StopId}/A22`);
                    const etaData = await etaRes.json();
                    
                    if (etaData.data && etaData.data.length > 0) {
                        const validEtas = etaData.data.filter(e => e.dir === 'I' && !!e.eta).sort((a, b) => new Date(a.eta) - new Date(b.eta));
                        
                        if (validEtas.length > 0) {
                            const eta1 = getEtaData(validEtas[0].eta);
                            document.getElementById('bus-eta-1').innerText = eta1.value;
                            document.getElementById('bus-eta-1-unit').innerText = eta1.unit;
                            
                            if (validEtas.length > 1) {
                                const eta2 = getEtaData(validEtas[1].eta);
                                document.getElementById('bus-eta-2').innerText = `${eta2.value} ${eta2.unit}`;
                            } else {
                                document.getElementById('bus-eta-2').innerText = "--";
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("城巴讀取失敗:", error);
            }
        }

        // 7. 更新流程管理
        async function fetchETAs() {
            await Promise.all([fetchMTR(), fetchBus()]);
            document.getElementById('last-update').innerText = formatTime(new Date());
        }

        async function init() {
            // 初始化時優先獲取假期數據，以利月曆渲染
            await fetchHolidays();
            
            updateTime();
            setInterval(updateTime, 30000);

            await fetchWeather();
            await fetchETAs();

            setInterval(fetchETAs, 25000);
            setInterval(fetchWeather, 60000);
        }

        window.onload = init;
    </script>
</body>
</html>
